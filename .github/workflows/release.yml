name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive versionName and versionCode from tag
        id: version
        run: |
          RAW_REF="${GITHUB_REF_NAME}"
          if [[ "$RAW_REF" == v* ]]; then
            TAG="${RAW_REF#v}"
          else
            TAG="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version_name=$TAG" >> "$GITHUB_OUTPUT"
          CORE="${TAG%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
          if [[ "$MAJOR" =~ ^[0-9]+$ ]] && [[ "$MINOR" =~ ^[0-9]+$ ]] && [[ "${PATCH:-0}" =~ ^[0-9]+$ ]]; then
            VCODE=$(( MAJOR * 10000 + MINOR * 100 + ${PATCH:-0} ))
          else
            VCODE="${GITHUB_RUN_NUMBER}"
          fi
          if [ "$VCODE" -le 0 ]; then
            VCODE=1
          fi
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Derived versionName=$TAG versionCode=$VCODE"

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"
            echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_BASE64 not set; release APK will use fallback debug signing."
          fi

      - name: Run unit tests and build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
